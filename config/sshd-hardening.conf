# Installed as /etc/ssh/sshd_config.d/00-webapp-hardening.conf by scripts/harden.sh.
# The 00- prefix matters: sshd keeps the first value it reads, and cloud images ship their own files in this directory.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
MaxAuthTries 3
LoginGraceTime 30
MaxStartups 5:30:20
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
