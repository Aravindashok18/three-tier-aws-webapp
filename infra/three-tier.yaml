AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Three-tier web app. Web tier: an internet-facing Application Load Balancer in front of
  Nginx on EC2. App tier: gunicorn/Flask on the same instances, in an Auto Scaling group.
  Data tier: RDS MySQL in private subnets that have no route to the internet.
  Static assets and release bundles live in a private S3 bucket.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(16|17|18|19|20)$'
    Description: CIDR block of the VPC, a /16 to /20. Sixteen /24 subnets are carved out of it.
  AdminCidr:
    Type: String
    Default: ""
    AllowedPattern: '^$|^(\d{1,3}\.){3}\d{1,3}/(1[6-9]|2[0-9]|3[0-2])$'
    Description: >-
      Address range allowed to SSH to the instances, for example 203.0.113.7/32.
      Leave empty to open no SSH port at all and use SSM Session Manager instead.
  KeyName:
    Type: String
    Default: ""
    Description: Name of an existing EC2 key pair for SSH. Leave empty if you use Session Manager only.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
  MinSize:
    Type: Number
    Default: 2
    MinValue: 1
  MaxSize:
    Type: Number
    Default: 4
    MinValue: 1
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Ubuntu 24.04 LTS, looked up from Canonical's public SSM parameter at launch time.
  ReleaseKey:
    Type: String
    Default: releases/webapp-latest.tgz
    Description: S3 key of the release bundle that scripts/deploy.sh uploads.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t3.medium]
  DBAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 1000
  DBMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  CertificateArn:
    Type: String
    Default: ""
    Description: ACM certificate ARN. When set, the load balancer serves HTTPS on 443 and redirects HTTP to it.

Rules:
  SshNotOpenToTheWorld:
    Assertions:
      - Assert: !Not [!Equals [!Ref AdminCidr, 0.0.0.0/0]]
        AssertDescription: AdminCidr must not be 0.0.0.0/0. Use your own address, or leave it empty.

Conditions:
  HasAdminCidr: !Not [!Equals [!Ref AdminCidr, ""]]
  HasKeyName: !Not [!Equals [!Ref KeyName, ""]]
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Public subnets hold the load balancer and the web/app instances.
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!GetAtt Vpc.CidrBlock, 16, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-a" }]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!GetAtt Vpc.CidrBlock, 16, 8]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-b" }]

  # Private subnets hold only the database. Their route table has no route to the internet.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [10, !Cidr [!GetAtt Vpc.CidrBlock, 16, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [11, !Cidr [!GetAtt Vpc.CidrBlock, 16, 8]]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-b" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private" }]

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Keeps instance-to-S3 traffic (release bundle, static assets) on the AWS network and off the NAT-less internet path.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds: [!Ref PublicRouteTable]

  # ------------------------------------------------------- security groups
  # Rules that point at another group are separate resources: written inline they would make the groups depend on each other.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer. Accepts web traffic from the internet and can only talk to the app instances.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "HTTP from anywhere" }
      SecurityGroupEgress:
        # Replaces the default allow-all egress rule; the real egress rule is AlbToAppEgress.
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: "Placeholder that removes the default allow-all rule" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-alb" }]

  AlbHttpsIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasCertificate
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS from anywhere

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances. Web traffic only from the load balancer, SSH only from AdminCidr.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: "OS package mirrors" }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: "S3, Secrets Manager and package repositories over TLS" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]

  AppSshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdminCidr
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref AdminCidr
      Description: SSH from the admin address only

  AppHttpFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: HTTP from the load balancer only

  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 80
      ToPort: 80
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      Description: Forward to the app instances

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database. MySQL from the app instances only. No outbound traffic.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - { IpProtocol: icmp, FromPort: -1, ToPort: -1, CidrIp: 127.0.0.1/32, Description: "Placeholder that removes the default allow-all rule" }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db" }]

  DbFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref AppSecurityGroup
      Description: MySQL from the app instances only

  AppToDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      DestinationSecurityGroupId: !Ref DbSecurityGroup
      Description: MySQL to the database

  # --------------------------------------------------------------- storage
  AppBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  AppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AppBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt AppBucket.Arn, !Sub "${AppBucket.Arn}/*"]
            Condition:
              Bool: { "aws:SecureTransport": "false" }

  # -------------------------------------------------------------- database
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets only
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Refuse database connections that are not encrypted
      Family: mysql8.4
      Parameters:
        require_secure_transport: "1"

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: mysql
      EngineVersion: "8.4.11"
      DBParameterGroupName: !Ref DbParameterGroup
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      DBName: webapp
      MasterUsername: webapp_admin
      ManageMasterUserPassword: true # RDS generates the password and keeps it in Secrets Manager
      MultiAZ: !Ref DBMultiAZ
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: [error, slowquery]

  # ------------------------------------------------------------- instances
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-app-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${AppBucket.Arn}/releases/*"
                  - !Sub "${AppBucket.Arn}/static/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AppBucket.Arn
                Condition:
                  StringLike: { "s3:prefix": ["releases/*", "static/*"] }
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !GetAtt Database.MasterUserSecret.SecretArn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestUbuntuAmi
        InstanceType: !Ref InstanceType
        KeyName: !If [HasKeyName, !Ref KeyName, !Ref "AWS::NoValue"]
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required # IMDSv2 only
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/sda1
            Ebs: { VolumeSize: 12, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
        TagSpecifications:
          - ResourceType: instance
            Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-app" }]
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -y
              apt-get install -y awscli

              # The release bundle is uploaded after the stack exists (scripts/deploy.sh).
              # Wait for it for up to 30 minutes instead of failing the first launch.
              for attempt in $(seq 1 60); do
                aws s3api head-object --region ${AWS::Region} --bucket ${AppBucket} --key ${ReleaseKey} && break
                echo "release not uploaded yet (attempt $attempt)"; sleep 30
              done
              mkdir -p /opt/webapp/release
              aws s3 cp --region ${AWS::Region} s3://${AppBucket}/${ReleaseKey} /tmp/release.tgz
              tar -xzf /tmp/release.tgz -C /opt/webapp/release

              APP_BUCKET=${AppBucket} \
              AWS_REGION=${AWS::Region} \
              DB_HOST=${DbHost} \
              DB_NAME=webapp \
              DB_SECRET_ARN=${DbSecretArn} \
              VPC_CIDR=${VpcCidr} \
              ADMIN_CIDR=${AdminCidr} \
              bash /opt/webapp/release/scripts/bootstrap.sh
            - DbHost: !GetAtt Database.Endpoint.Address
              DbSecretArn: !GetAtt Database.MasterUserSecret.SecretArn

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
    Properties:
      MinSize: !Ref MinSize
      MaxSize: !Ref MaxSize
      VPCZoneIdentifier: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 1800 # covers the wait for the first release upload plus bootstrap
      TerminationPolicies: [OldestLaunchTemplate, OldestInstance]
      Tags:
        - { Key: Name, Value: !Sub "${AWS::StackName}-app", PropagateAtLaunch: true }

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: { PredefinedMetricType: ASGAverageCPUUtilization }
        TargetValue: 60

  # -------------------------------------------------------- load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: "true" }
        - { Key: idle_timeout.timeout_seconds, Value: "60" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerUrl:
    Description: Open this in a browser once the instances are healthy.
    Value: !Sub "http://${LoadBalancer.DNSName}"
  AppBucketName:
    Description: Holds releases/ and static/. Used by scripts/deploy.sh.
    Value: !Ref AppBucket
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  DatabaseEndpoint:
    Description: Reachable only from the app security group.
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt Database.MasterUserSecret.SecretArn
